spring.application.name=Transport Management System
server.port=4000
# MySQL Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/tms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG
tms.security.jwt.secret=${JWT_SECRET_KEY:my_super_secret_fallback_key_that_is_long_enough_32_chars}
